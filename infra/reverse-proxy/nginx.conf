# Reverse proxy: HTTP → HTTPS redirect + HSTS + TLS 1.2+
# Forwards /api/* to backend, everything else to frontend.

# Logging (SR-043 AC 4, PRB-068): the access log is an allow-list. It records the normalised path
# (never the request line or query string) and no header at all, so no Referer, Cookie,
# X-CSRF-Token or Set-Cookie value can be logged. The activation token is a path segment, so the
# path is replaced for the two activation routes.
map $uri $medhub_log_path {
    default                  $uri;
    ~^/api/v1/activation/    /api/v1/activation/[redacted];
    ~^/activation/           /activation/[redacted];
}

log_format medhub_redacted escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"path":"$medhub_log_path","protocol":"$server_protocol","status":"$status",'
    '"bytes":"$body_bytes_sent","request_time":"$request_time","upstream_status":"$upstream_status"}';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log medhub_redacted;
    # Redirect all HTTP traffic to HTTPS (SR-008: data in transit encryption)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    access_log /var/log/nginx/access.log medhub_redacted;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS 1.2+ only (SR-008)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS — 1 year, includeSubDomains (SR-008)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Basic security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Activation routes carry the token in the path. nginx writes the request line and Referer into
    # error-log entries and its format cannot be changed, so these locations log only at crit
    # (per-request upstream failures are level error and are not written). Regex locations win over
    # the prefix locations below. SR-043 AC 4.
    location ~ ^/api/v1/activation/ {
        error_log          /var/log/nginx/error.log crit;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # The activation page (/activation/<token>, and the old /activate?token=): no Referer is sent
    # from it, so no other error-log entry can carry the token. add_header in a location replaces
    # the server-level ones, so they are repeated.
    location ~ ^/activat {
        error_log          /var/log/nginx/error.log crit;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_pass         http://frontend:8080;
    }

    # Route API calls to the backend service (internal network)
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health check passthrough (no auth required)
    location /healthz {
        proxy_pass http://backend:8000;
    }

    # Serve frontend static files
    location / {
        proxy_pass http://frontend:8080;
    }
}
