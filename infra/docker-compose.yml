version: "3.9"

# MedHub Docker Compose topology
# Only the reverse-proxy publishes ports 80/443. All other services
# communicate on the internal 'medhub' network.

networks:
  # Fixed subnet so the reverse proxy has a fixed address, which the backend trusts as the only
  # proxy (SR-042 AC 3, ADR-0019). Containers without a fixed address are given one from
  # ip_range only, so none of them can take the proxy's address first. The subnet lies OUTSIDE
  # Docker's default address pools (172.16.0.0/12 and 192.168.0.0/16): the other networks, this
  # project's `object-store` among them, take their subnets from those pools and so can never
  # overlap this one (PRB-076). To change the network, edit subnet and ip_range here, the proxy's
  # ipv4_address and the backend's TRUSTED_PROXIES below (see DEPLOY.md).
  medhub:
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.77.0/24
          ip_range: 10.77.77.128/25
  # Object store network (SR-040 AC 3, ADR-0015 D4): joined only by object-store, object-store-init
  # and backend. internal: no egress and no published port. The store's unauthenticated internal
  # ports are therefore unreachable from the proxy, frontend, postgres, redis and celery-worker.
  # The CI override (TASK-179) attaches the store to a CI-only network too, because Docker
  # cannot publish a port from a container that is on internal networks only.
  object-store:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  # The object store's data. The name is the project's default unless OBJECT_STORE_VOLUME names
  # another volume; only the SSE-key procedure in DEPLOY.md sets it, to switch to the volume the
  # attachments were copied to under the new key (TASK-196). An empty value keeps the default,
  # spelled out because current Compose rejects an empty `name:` (PRB-077).
  object_store_data:
    name: ${OBJECT_STORE_VOLUME:-${COMPOSE_PROJECT_NAME}_object_store_data}

services:
  # ── Reverse Proxy (nginx) ─────────────────────────────────────────────────
  # Only service that publishes external ports. Enforces HTTPS + HSTS (SR-008).
  reverse-proxy:
    image: nginx:1.31.8-alpine@sha256:e2d97c2b8c016f12c2f1a27d095685063b2f281c4edf2babfde6001cf4fb77a8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      medhub:
        ipv4_address: 10.77.77.2
    restart: unless-stopped

  # ── Backend (FastAPI via Gunicorn + Uvicorn workers) ──────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    # No env_file (TASK-191 round 2): infra/.env also holds the owner credentials (POSTGRES_PASSWORD,
    # DATABASE_OWNER_URL), and env_file would hand them to every service. Each service lists
    # exactly the settings it reads; Compose fills them from infra/.env or the shell by
    # interpolation. Same expressions as the initialiser and the store, so a shell variable cannot
    # point the backend and the initialiser at different buckets or endpoints.
    # Every secret setting has a `:?` guard and no default (SR-041 AC 2): Compose stops, naming the
    # setting, when it is unset or empty. SMTP is not used by the API (only the worker sends mail),
    # so the backend gets SMTP_HOST, which Settings requires, and no SMTP credential.
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      AT_REST_ENCRYPTION_KEY: ${AT_REST_ENCRYPTION_KEY:?AT_REST_ENCRYPTION_KEY must be set}
      # Names the current key in every new field ciphertext (SR-022 AC 6, ADR-0018). Required, not secret.
      AT_REST_ENCRYPTION_KEY_ID: ${AT_REST_ENCRYPTION_KEY_ID:?AT_REST_ENCRYPTION_KEY_ID must be set}
      # Optional "id:key,id:key" earlier keys, decryption only. No default, no guard (like SMTP_PASSWORD).
      AT_REST_ENCRYPTION_RETIRED_KEYS: ${AT_REST_ENCRYPTION_RETIRED_KEYS}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-http://object-store:8333}
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:?OBJECT_STORE_ACCESS_KEY must be set}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:?OBJECT_STORE_SECRET_KEY must be set}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-medhub}
      SESSION_INACTIVITY_CLINICAL_SECONDS: ${SESSION_INACTIVITY_CLINICAL_SECONDS:-900}
      SESSION_INACTIVITY_ADMIN_SECONDS: ${SESSION_INACTIVITY_ADMIN_SECONDS:-1800}
      SESSION_ABSOLUTE_LIFETIME_SECONDS: ${SESSION_ABSOLUTE_LIFETIME_SECONDS:-28800}
      SESSION_MAX_CONCURRENT: ${SESSION_MAX_CONCURRENT:-3}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      TRUSTED_PROXIES: 10.77.77.2
    expose:
      - "8000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      object-store-init:
        condition: service_completed_successfully
    networks:
      - medhub
      - object-store
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend (nginx static, non-root user, port 8080: SR-041 AC 1) ────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    expose:
      - "8080"
    networks:
      - medhub
    restart: unless-stopped

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    environment:
      POSTGRES_DB: medhub
      POSTGRES_USER: medhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - medhub
    restart: unless-stopped
    # db-migrate starts only once the server accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U medhub -d medhub"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

  # ── Database migrations and roles (one-shot, owner credential) ────────────
  # The only process that migrates and the only service that receives DATABASE_OWNER_URL
  # (SR-023 AC 8, SR-041 AC 2, ADR-0017). In one run, as the owner: check the secret settings,
  # `alembic upgrade head`, then `python -m app.db.roles` (creates the runtime role named in
  # DATABASE_URL and grants it, withholding UPDATE/DELETE/TRUNCATE on audit_log). A table added by
  # a migration is granted by that same run. backend, celery-worker and celery-beat start only
  # after it exits 0. The runtime settings below are the ones the secret rule checks. The last
  # step (`app.db.reencrypt --verify-key-ids`) refuses, changing nothing, when a stored field value
  # names a key id that is neither the current key nor a retired one, so a retired key cannot be
  # removed while values still need it (SR-022 AC 8, TASK-195). The same module rotates the keys.
  db-migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    entrypoint:
      - sh
      - -c
      - >
        python -c "from app.core.secret_settings import enforce; enforce()"
        && alembic upgrade head
        && python -m app.db.roles
        && python -m app.db.reencrypt --verify-key-ids
    environment:
      PYTHONPATH: /app
      DATABASE_OWNER_URL: ${DATABASE_OWNER_URL:?DATABASE_OWNER_URL must be set}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      AT_REST_ENCRYPTION_KEY: ${AT_REST_ENCRYPTION_KEY:?AT_REST_ENCRYPTION_KEY must be set}
      # Names the current key in every new field ciphertext (SR-022 AC 6, ADR-0018). Required, not secret.
      AT_REST_ENCRYPTION_KEY_ID: ${AT_REST_ENCRYPTION_KEY_ID:?AT_REST_ENCRYPTION_KEY_ID must be set}
      # Optional "id:key,id:key" earlier keys, decryption only. No default, no guard (like SMTP_PASSWORD).
      AT_REST_ENCRYPTION_RETIRED_KEYS: ${AT_REST_ENCRYPTION_RETIRED_KEYS}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-http://object-store:8333}
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:?OBJECT_STORE_ACCESS_KEY must be set}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:?OBJECT_STORE_SECRET_KEY must be set}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-medhub}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medhub
    restart: "no"

  # ── Redis 7 (sessions + Celery broker) ────────────────────────────────────
  redis:
    image: redis:7.4.12-bookworm@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - medhub
    restart: unless-stopped

  # ── Object-store credential preflight (one-shot, no network) ──────────────
  # Refuses weak or default object-store keys before the store starts (SR-040 AC 2), and an SSE key
  # that is unset, a placeholder, not 32 bytes or equal to the field key or a retired field key
  # (SR-041 AC 5). It is the only Python service that receives OBJECT_STORE_SSE_KEY, and it
  # receives the field keys only to compare them with it.
  # The entrypoint is overridden so the backend's entrypoint does not run.
  object-store-preflight:
    build:
      context: ../backend
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "app.core.object_store_credentials"]
    # Same expressions as the object-store service, so the rule checks exactly the values the store
    # receives (shell environment, --env-file or infra/.env).
    environment:
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:?OBJECT_STORE_ACCESS_KEY must be set}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:?OBJECT_STORE_SECRET_KEY must be set}
      OBJECT_STORE_SSE_KEY: ${OBJECT_STORE_SSE_KEY:?OBJECT_STORE_SSE_KEY must be set}
      AT_REST_ENCRYPTION_KEY: ${AT_REST_ENCRYPTION_KEY:?AT_REST_ENCRYPTION_KEY must be set}
      # Optional earlier field keys, compared with the SSE key only. No default, no guard.
      AT_REST_ENCRYPTION_RETIRED_KEYS: ${AT_REST_ENCRYPTION_RETIRED_KEYS}
    network_mode: none
    restart: "no"

  # ── Object store: SeaweedFS (S3-compatible, SSE-S3 AES256) ────────────────
  # Replaces MinIO (ADR-0015, CR-002, SOUP-036). Pinned by tag and OCI index digest, so amd64 and
  # arm64 hosts pull the same release. `weed server` binds master, volume server and filer to
  # loopback; only S3 (8333, and its gRPC port 18333) listens on the container address. Admin UI,
  # WebDAV, SFTP, Iceberg, Lance and telemetry are off. No admin UI, no host port (SR-040 AC 1).
  object-store:
    image: chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    command: >
      server -dir=/data -ip=127.0.0.1 -ip.bind=127.0.0.1 -filer -s3 -s3.ip.bind=0.0.0.0
      -s3.port.iceberg=0 -s3.port.lance=0 -master.volumeSizeLimitMB=1024 -master.telemetry=false
    depends_on:
      object-store-preflight:
        condition: service_completed_successfully
    environment:
      # Admin identity (the only S3 identity)
      AWS_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY:?OBJECT_STORE_ACCESS_KEY must be set}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_KEY:?OBJECT_STORE_SECRET_KEY must be set}
      # SSE-S3 key at rest (SR-016, SR-022). Its own setting, never the field key (SR-041 AC 5,
      # ADR-0018): the preflight refuses the stack when they match. The key belongs to the volume.
      WEED_S3_SSE_KEY: ${OBJECT_STORE_SSE_KEY:?OBJECT_STORE_SSE_KEY must be set}
    volumes:
      - object_store_data:/data
    expose:
      - "8333"
    networks:
      - object-store
    restart: unless-stopped
    # Healthy only once the S3 endpoint answers (PRB-039); the initialiser waits for it.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

  # ── Bucket initialiser (one-shot, backend image, boto3) ───────────────────
  # Creates the bucket, sets AES256 default encryption and checks it stays private
  # (SR-040 AC 4, SR-022 AC 4). Starts only once the store is healthy; exits non-zero on any
  # failure, which keeps the backend down. The entrypoint is overridden so the backend's
  # entrypoint does not run.
  object-store-init:
    build:
      context: ../backend
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "app.core.object_store_init"]
    # Same expressions as the object-store, preflight and backend services: one source.
    environment:
      OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-http://object-store:8333}
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:?OBJECT_STORE_ACCESS_KEY must be set}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:?OBJECT_STORE_SECRET_KEY must be set}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-medhub}
    depends_on:
      object-store-preflight:
        condition: service_completed_successfully
      object-store:
        condition: service_healthy
    networks:
      - object-store
    restart: "no"

  # ── Celery Worker ─────────────────────────────────────────────────────────
  # The image entrypoint runs this `command:` (PRB-061): the container is a Celery worker, not
  # gunicorn. Connects as the runtime role; has no owner credential.
  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=4
    # Same guards as the backend (SR-041 AC 2). Sends the mail, so it alone gets the SMTP settings.
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      AT_REST_ENCRYPTION_KEY: ${AT_REST_ENCRYPTION_KEY:?AT_REST_ENCRYPTION_KEY must be set}
      # Names the current key in every new field ciphertext (SR-022 AC 6, ADR-0018). Required, not secret.
      AT_REST_ENCRYPTION_KEY_ID: ${AT_REST_ENCRYPTION_KEY_ID:?AT_REST_ENCRYPTION_KEY_ID must be set}
      # Optional "id:key,id:key" earlier keys, decryption only. No default, no guard (like SMTP_PASSWORD).
      AT_REST_ENCRYPTION_RETIRED_KEYS: ${AT_REST_ENCRYPTION_RETIRED_KEYS}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-http://object-store:8333}
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:?OBJECT_STORE_ACCESS_KEY must be set}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:?OBJECT_STORE_SECRET_KEY must be set}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-medhub}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://medhub.example}
    depends_on:
      redis:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    networks:
      - medhub
    restart: unless-stopped

  # ── Celery Beat (scheduler) ───────────────────────────────────────────────
  # Runs the beat_schedule (the anonymized-dataset retention sweep, backend/app/workers/
  # celery_app.py); nothing ran it before (PRB-061). The schedule file goes to /tmp: the image's
  # non-root user cannot write to /app. Exactly one beat must run, so do not scale this service.
  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: >
      celery -A app.workers.celery_app beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      AT_REST_ENCRYPTION_KEY: ${AT_REST_ENCRYPTION_KEY:?AT_REST_ENCRYPTION_KEY must be set}
      # Names the current key in every new field ciphertext (SR-022 AC 6, ADR-0018). Required, not secret.
      AT_REST_ENCRYPTION_KEY_ID: ${AT_REST_ENCRYPTION_KEY_ID:?AT_REST_ENCRYPTION_KEY_ID must be set}
      # Optional "id:key,id:key" earlier keys, decryption only. No default, no guard (like SMTP_PASSWORD).
      AT_REST_ENCRYPTION_RETIRED_KEYS: ${AT_REST_ENCRYPTION_RETIRED_KEYS}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-http://object-store:8333}
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:?OBJECT_STORE_ACCESS_KEY must be set}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:?OBJECT_STORE_SECRET_KEY must be set}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-medhub}
      RETENTION_SWEEP_CRON: "${RETENTION_SWEEP_CRON:-0 2 * * *}"
    depends_on:
      redis:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    networks:
      - medhub
    restart: unless-stopped
