server {
    listen 8080;
    # The reverse proxy is the access log of record; this container only serves static files behind
    # it. An error entry would carry the request line, so only crit is written (SR-043 AC 4).
    access_log off;
    error_log /var/log/nginx/error.log crit;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
